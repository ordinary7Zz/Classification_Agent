# Base Datasets Information (原始数据集信息)
# 记录每个原始数据集的主要设备分布，用于推断输入数据可能来自哪个原始数据集
base_datasets_info:
  TN3K:
    main_devices: ["GE Logiq E9", "ARIETTA 850", "RESONA 70B", "Hitachi Aloka Arietta V70"]  # TN3K数据集的主要设备
    centers:
      - "Zhujiang Hospital, Southern Medical University"
    years: [2016, 2020]    
  ThyroidXL:
    main_devices: ["Hitachi Aloka Arietta V70"]  # ThyroidXL数据集的主要设备
    centers:
      - "National Hospital of Endocrinology, Hanoi, Vietnam"
    years: [2023, 2025]                  # 采集年份范围
  TN5K:
    main_devices: ["GE Logiq E9", "GE S7"]  # TN5K数据集的主要设备
    probe_frequency_mhz: [5, 12]
    Imaging mode: B-mode Ultrasound (2D)
    centers:
      - "National Cancer Center/Cancer Hospital, Chinese Academy of Medical Sciences and Peking Union Medical College"
  CineClip:
    main_devices: []  # CineClip数据集的主要设备
    centers:
      - "Stanford University Medical Center"

# Data Paths (输入数据路径)
data:
  image_input: "/mnt/wangbd8/workspace/DataSets/ThyroidAgent/train_val_test/Cine-Clip/test/images"
  mask_input: "/mnt/wangbd8/workspace/DataSets/ThyroidAgent/train_val_test/Cine-Clip/test/masks"
  device_info: ["GE Logiq E9", "ARIETTA 850", "RESONA 70B", "Hitachi Aloka Arietta V70"]  # 输入数据集的设备信息（列表，例如: ["GE", "Siemens"]），如果未知可以为 null
  label_file: "/mnt/wangbd8/workspace/DataSets/ThyroidAgent/train_val_test/Cine-Clip/test/Cine-Clip_test_label.json"  # 标签文件路径；为 null 时将根据 output_dir 自动推断
  start_index: 0  # 从第几个样本开始（仅目录输入有效）
  total_count: null  # 本次推理处理多少张；null 表示处理到末尾

# Output Configuration (输出配置)
output:
  output_dir: "output/Cine-Clip/Superimposed_dataset"
  
# 二分类概率校准（可选；由 scripts/fit_binary_calibrators.py 离线生成 JSON）
# enabled: false 或未配置时与原先一致；加载失败或文件损坏时自动回退为不校准
calibration:
  enabled: false
  artifacts_dir: "calibration/artifacts"

# Agent Configuration
agent:
  decision_threshold: 0.5
  max_retries: 3
  max_batch_size: 2  # Maximum images per batch API call
  enable_agent: false  # true: 使用大模型决策；false: 不调用大模型，按 top_k 置信度 soft voting
  top_k: 6  # 无 Agent 时：对 top_confidence 最高的 top_k 个模型做 soft voting；有 Agent 且存在分歧时：大模型选出 top_k 个模型再融合。为 1 时与原先单模型决策一致

